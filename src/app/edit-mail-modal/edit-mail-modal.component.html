<div
  class="modal fade show d-block"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="editMailModalTitle"
  style="background: rgba(0, 0, 0, 0.5)"
>
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editMailModalTitle">
          Modifier le mail avant envoi
        </h5>
        <button
          type="button"
          class="btn-close"
          aria-label="Fermer"
          (click)="onAnnuler()"
        ></button>
      </div>

      <div class="modal-body">
        <quill-editor
          [(ngModel)]="contenu"
          format="html"
          [modules]="{ toolbar: toolbar }"
        ></quill-editor>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onAnnuler()">
          Annuler
        </button>
        <button type="button" class="btn btn-warning" (click)="onValider()">
          Valider les modifications
        </button>
      </div>
    </div>
  </div>
</div>
