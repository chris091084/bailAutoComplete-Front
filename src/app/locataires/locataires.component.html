<div class="container mt-4">
  <div class="mb-3">
    <h2>Liste des Locataires</h2>
    <p class="text-muted mb-0">
      Un locataire est créé uniquement lors de la génération d'un bail.
    </p>
  </div>
  <!-- Un locataire ne se supprime pas : il sort du logement et bascule dans le
       second onglet, d'où il peut être réintégré. -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button
        type="button"
        class="nav-link"
        [class.active]="ongletActif === 'actifs'"
        (click)="ongletActif = 'actifs'"
      >
        Locataires
        <span class="badge text-bg-secondary ms-1">{{ locataires.length }}</span>
      </button>
    </li>
    <li class="nav-item">
      <button
        type="button"
        class="nav-link"
        [class.active]="ongletActif === 'sortis'"
        (click)="ongletActif = 'sortis'"
      >
        Locataires sortis
        <span class="badge text-bg-secondary ms-1">
          {{ locatairesSortis.length }}
        </span>
      </button>
    </li>
  </ul>
  <app-locataires-table
    *ngIf="ongletActif === 'actifs'"
    [locataires]="locataires"
    [appartements]="appartements"
    mode="actifs"
    (rafraichir)="rechargerLocataires()"
  >
  </app-locataires-table>
  <app-locataires-table
    *ngIf="ongletActif === 'sortis'"
    [locataires]="locatairesSortis"
    [appartements]="appartements"
    mode="sortis"
    messageListeVide="Aucun locataire sorti."
    (rafraichir)="rechargerLocataires()"
  >
  </app-locataires-table>
</div>
