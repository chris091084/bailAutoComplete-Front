<div
  class="modal fade show d-block"
  tabindex="-1"
  role="dialog"
  style="background: rgba(0, 0, 0, 0.5)"
  >
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modifier un Locataire</h5>
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="onCancel()"
        ></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nom" class="form-label">Nom</label>
              <input
                type="text"
                class="form-control"
                id="nom"
                formControlName="nom"
                />
            </div>
            <div class="col-md-6 mb-3">
              <label for="prenom" class="form-label">Prénom</label>
              <input
                type="text"
                class="form-control"
                id="prenom"
                formControlName="prenom"
                />
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="telephone" class="form-label">Téléphone</label>
              <input
                type="tel"
                class="form-control"
                id="telephone"
                formControlName="telephone"
                />
            </div>
            <div class="col-md-6 mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                formControlName="email"
                />
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="anneeNaissance" class="form-label">
                Année de naissance
                <span class="text-muted">(facultatif)</span>
              </label>
              <input
                type="number"
                class="form-control"
                id="anneeNaissance"
                formControlName="anneeNaissance"
                [min]="anneeNaissanceMin"
                [max]="anneeCourante"
                placeholder="1998"
                />
              <div class="form-text">Sert à afficher l'âge dans la liste.</div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="entree" class="form-label">Date d'entrée</label>
              <input
                type="date"
                class="form-control"
                id="entree"
                formControlName="entree"
                />
              <div class="form-text">
                Reprise de la date de prise d'effet du bail.
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label for="appartementId" class="form-label">Appartement</label>
            <select
              class="form-select"
              id="appartementId"
              formControlName="appartementId"
              >
              <option [ngValue]="null" disabled>
                Sélectionner un appartement
              </option>
              @for (appartement of appartementsOptions; track appartement.id) {
                <option
                  [ngValue]="appartement.id"
                  >
                  {{ appartement.label }}
                </option>
              }
            </select>
          </div>
          <div class="mb-3">
            <label for="resultFormId" class="form-label">
              Bail d'origine <span class="text-muted">(facultatif)</span>
            </label>
            <select
              class="form-select"
              id="resultFormId"
              formControlName="resultFormId"
              >
              <option [ngValue]="null">Aucun</option>
              @for (resultForm of resultFormsOptions; track resultForm.id) {
                <option
                  [ngValue]="resultForm.id"
                  >
                  {{ resultForm.label }}
                </option>
              }
            </select>
            <div class="form-text">
              Fournit la date de signature du bail reprise dans la lettre de
              congé.
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              (click)="onCancel()"
              >
              Annuler
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="form.invalid"
              >
              Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
