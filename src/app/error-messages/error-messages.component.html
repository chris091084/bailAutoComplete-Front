@if (
  (control?.invalid && this.isSubmit) ||
  (control?.invalid && control?.touched)
  ) {
  <div
    class="invalid-error"
    >
    @if (control?.errors?.['required']) {
      <div>Ce champ est requis.</div>
    }
    @if (control?.errors?.['email']) {
      <div>
        Ce champ doit être un email valide.
      </div>
    }
  </div>
}
